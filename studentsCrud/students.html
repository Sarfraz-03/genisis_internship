<!DOCTYPE html>
<html>
<head>
    <title>Student CRUD App</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        form {
            margin: 20px auto;
            padding: 15px;
            background: white;
            width: 300px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .add-btn { background: green; color: white; }
        .update-btn { background: orange; color: white; }
        .delete-btn { background: red; color: white; }
        .edit-btn { background: blue; color: white; }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #333;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Student CRUD Application</h1>

    <form id="studentForm">
        <input type="hidden" id="studentId">
        <input type="text" id="name" placeholder="Enter Name" required>
        <input type="number" id="age" placeholder="Enter Age" required>
        <input type="text" id="grade" placeholder="Enter Grade" required>
        <br>
        <button type="submit" class="add-btn">Save Student</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Grade</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>

<script>
const apiURL = "http://localhost:3000/students";

// Load Students Automatically
window.onload = loadStudents;

// ================= LOAD =================
async function loadStudents() {
    const response = await fetch(apiURL);
    const students = await response.json();

    const table = document.getElementById("studentTable");
    table.innerHTML = "";

    students.forEach(student => {
        table.innerHTML += `
            <tr>
                <td>${student.name}</td>
                <td>${student.age}</td>
                <td>${student.grade}</td>
                <td>
                    <button class="edit-btn" onclick="editStudent('${student._id}', '${student.name}', '${student.age}', '${student.grade}')">Edit</button>
                    <button class="delete-btn" onclick="deleteStudent('${student._id}')">Delete</button>
                </td>
            </tr>
        `;
    });
}

// ================= ADD / UPDATE =================
document.getElementById("studentForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const id = document.getElementById("studentId").value;
    const name = document.getElementById("name").value;
    const age = document.getElementById("age").value;
    const grade = document.getElementById("grade").value;

    const studentData = { name, age, grade };

    if (id) {
        // UPDATE
        await fetch(`${apiURL}/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(studentData)
        });
    } else {
        // ADD
        await fetch(apiURL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(studentData)
        });
    }

    document.getElementById("studentForm").reset();
    document.getElementById("studentId").value = "";
    loadStudents();
});

// ================= EDIT =================
function editStudent(id, name, age, grade) {
    document.getElementById("studentId").value = id;
    document.getElementById("name").value = name;
    document.getElementById("age").value = age;
    document.getElementById("grade").value = grade;
}

// ================= DELETE =================
async function deleteStudent(id) {
    if (confirm("Are you sure you want to delete this student?")) {
        await fetch(`${apiURL}/${id}`, {
            method: "DELETE"
        });
        loadStudents();
    }
}
</script>

</body>
</html>
